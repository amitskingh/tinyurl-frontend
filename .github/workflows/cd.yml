name: Deploy Frontend to EC2
on:
  push:
    branches:
      - prod
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout repository (triggers the workflow)
      - name: Checkout code
        uses: actions/checkout@v4

      # SSH into EC2, build on server and deploy directly
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/tinyurl-frontend

            # Pull latest code from prod branch
            git fetch origin
            git checkout prod
            git reset --hard origin/prod

            # Install dependencies and build on EC2
            # Vite reads .env.production automatically during build
            npm ci
            npm run build

            # Replace live frontend with new build
            # Keeps same directory inode — nginx volume mount stays valid
            sudo rm -rf /var/www/tinyurl-frontend/*
            sudo cp -r dist/* /var/www/tinyurl-frontend/
