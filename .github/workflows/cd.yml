name: Deploy Frontend to EC2

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Build frontend
      - name: Build frontend
        run: npm run build

      # Upload dist files to EC2
      - name: Copy dist to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/*"
          target: "/var/www/tinyurl-frontend"
          # Upload files directly without creating dist folder
          # This becomes "/var/www/tinyurl-frontend/index.html" instead of "/var/www/tinyurl-frontend/dist/index.html"
          strip_components: 1